[package]
name = "topgg"
version = "2.0.0"
edition = "2024"
authors = ["null (https://github.com/null8626)", "Top.gg <support@top.gg> (https://top.gg)"]
description = "The community-maintained Rust SDK for Top.gg."
readme = "README.md"
repository = "https://github.com/Top-gg-Community/rust-sdk"
license = "MIT"
keywords = ["discord", "bot", "topgg"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".gitattributes", ".gitignore", "rustfmt.toml", "src/mocks"]

[dependencies]
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.23", default-features = false, features = ["std"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
hex = { version = "0.4", optional = true }
hmac = { version = "0.13", optional = true }
rand = { version = "0.10", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["charset", "default-tls", "http2"], optional = true }
sha2 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tokio = { version = "1.54", features = ["macros", "rt", "sync"], optional = true }
tokio-util = { version = "0.7", optional = true }
urlencoding = "2"

[dev-dependencies]
httpmock = { version = "0.9", default-features = false, features = ["http2", "https"] }
tokio = { version = "1.54", features = ["macros", "rt"] }

[features]
default = ["api", "oauth2"]
api = ["async-trait", "reqwest", "serde_json"]
oauth2 = ["api", "base64", "hex", "rand", "sha2", "tokio", "tokio-util"]
webhooks = ["hex", "hmac", "sha2"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(doc_cfg)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
trait_duplication_in_bounds = "allow"
unreadable_literal = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]